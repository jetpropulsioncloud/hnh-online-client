name: One-time v0.7.9 coordinator fix
on:
  push:
    branches: [feat/direct-manipulation-v079]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/direct-manipulation-v079
      - name: Fix coordinator version and verify
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('client.js')
          s=p.read_text().replace("version:'0.7.8'","version:'0.7.9'")
          p.write_text(s)
          p=Path('tests/ui-coordinator-test.js')
          s=p.read_text().replace("version:'0.7.8'","version:'0.7.9'")
          p.write_text(s)
          PY
          node --check client.js
          node tests/ui-coordinator-test.js
          node tests/smoke-test.js
          node tests/rules-test.js
          node tests/rules-patch-test.js
          node tests/ability-completion-test.js
          node tests/ability-edge-test.js
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client.js tests/ui-coordinator-test.js
          git commit -m "Align v0.7.9 UI coordinator version"
          git push origin HEAD:feat/direct-manipulation-v079
