name: One-time v0.8.0 combat UI refactor

on:
  push:
    branches: [feat/combat-arrows-muster-clarity-v080]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/combat-arrows-muster-clarity-v080
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refactor combat arrows and Muster readability
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          client = Path('client.js')
          s = client.read_text()

          building = r'''  function musterClassSlug(value){return String(value||'muster').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
  function musterRulesText(b){
    const text=String(b.text||'');
    if(!b.muster)return text;
    return text.replace(/^Muster\s*[—-]\s*[^.]+\.\s*Recruit:\s*pay\s*[^.]+\.\s*/i,'').trim();
  }

  function buildingCard(p,pi,b){
    const ruined=E.isRuined(b),used=b.muster?E.housingUsed(p,b.uid):0;
    const musterSlug=musterClassSlug(b.musterClass),displayText=musterRulesText(b);
    const artLabel=b.muster?b.musterClass:b.subtype;
    return `<article class="gameCard building ${ruined?'ruined':''}" data-building-uid="${b.uid}" data-player-index="${pi}" ${b.muster?`data-muster-uid="${b.uid}" data-muster-class="${musterSlug}"`:''} data-attack-building="${b.uid}"><div class="artWindow buildingArt"><span>${buildingIcon(b)}</span><small>${esc(artLabel)}</small></div><div class="cardFrame"><div class="cardTop"><div><b>${esc(b.name)}</b>${!b.muster?`<small>${ruined?'RUINED · ':''}${esc(b.subtype)}</small>`:ruined?'<small>RUINED</small>':''}</div>${b.shield?'<span class="shield">🛡</span>':''}</div><div class="badgeRow"><span>🧱 ${b.damage}/${b.durability}</span><span>✨ ${ruined?0:b.prosperity||0}</span>${b.muster?`<span>🏠 ${used}/${b.housing}</span>`:''}</div>${b.muster?`<div class="musterIdentity muster-${musterSlug}"><strong>${esc(b.musterClass)}</strong><small>Muster · Recruit ${costText(b.recruitCost)}</small></div>`:''}${displayText?`<p>${esc(displayText)}</p>`:''}${b.manual?`<span class="manualTag">Manual: ${esc(b.manual)}</span>`:''}${b.rehousingDueOwnTurn!==null&&ruined?'<span class="warnTag">Residents inactive · rehouse by deadline</span>':''}${workshopAction(p,pi,b)}</div></article>`;
  }
'''
          s, n = re.subn(r'  function buildingCard\(p,pi,b\)\{.*?\n  \}\n\n  function workshopAction', building+'\n  function workshopAction', s, count=1, flags=re.S)
          assert n == 1, 'buildingCard replacement failed'

          critter = r'''  function critterCard(p,pi,r){
    const ready=E.residentReady(game,p,r),grit=E.residentGrit(game,p,r,r.blocking),fresh=r.recruitedTurn===game.turnNo&&pi===game.active;
    const canDragAttack=pi===game.active&&isHuman(pi)&&E.canAttack(game,pi,r);
    const defenderIndex=1-game.active;
    const legalBlockIndices=game.phase==='Block'&&pi===defenderIndex&&isHuman(pi)
      ?game.combat.attacks.map((a,i)=>E.canBlock(game,pi,r,a)?i:null).filter(i=>i!==null)
      :[];
    const canDragBlock=legalBlockIndices.length>0;
    const directClass=canDragBlock?' blockDraggable':canDragAttack?' attackDraggable':'';
    const directAttrs=canDragBlock?` data-block-indices="${legalBlockIndices.join(',')}" title="Drag this Critter onto an attacker to block"`:canDragAttack?' title="Drag this Critter to an enemy target"':'';
    return `<article class="gameCard critter ${!ready?'inactive':''} ${r.tired?'tired':''} ${r.attacking?'attacking':''} ${r.blocking?'blocking':''}${directClass}" data-resident-uid="${r.uid}" data-player-index="${pi}"${directAttrs}><div class="artWindow critterArt"><span>${critterIcon(r)}</span><small>${r.advanced?'ADVANCED · ':''}${(r.musterClasses||[]).join(' · ')}</small></div><div class="cardFrame"><div class="cardTop"><b>${esc(r.name)}</b>${r.shield?'<span class="shield">🛡</span>':''}</div><div class="badgeRow critterStats"><span>💪 ${r.might}</span><span>❤️ ${r.damage}/${grit}</span></div><div class="homeLine">🏡 ${esc(p.village.find(b=>b.uid===r.musterUid)?.name||'No home')}</div>${r.tool?`<div class="toolLine">🧰 ${esc(r.tool.name)}</div>`:''}${fresh?'<span class="freshTag">New · can block</span>':''}${canDragBlock?'<span class="dragHint blockHint">Drag onto attacker</span>':canDragAttack?'<span class="dragHint attackHint">Drag to attack</span>':''}</div></article>`;
  }
'''
          s, n = re.subn(r'  function critterCard\(p,pi,r\)\{.*?\n  \}\n\n  function handPanel', critter+'\n  function handPanel', s, count=1, flags=re.S)
          assert n == 1, 'critterCard replacement failed'

          combat = r'''  function combatPanel(){
    if(!game.combat.attacks.length&&game.phase!=='Block')return `<section class="combatRibbon quiet compactTrial"><span>⚔</span><b>Frost Trial</b><small>Drag a ready Critter to an enemy target.</small></section>`;
    const defIndex=1-game.active,humanDefender=isHuman(defIndex),humanAttacker=isHuman(game.active);
    if(!game.combat.committed&&humanAttacker){
      const n=game.combat.attacks.length;
      return `<section class="combatRibbon activeCombat combatDraft"><div class="combatHeading"><span>⚔</span><div><b>${n} attacker${n===1?'':'s'} ready</b><small>Orange arrows show every declared attack. Drag more Critters or commit.</small></div></div><div class="combatButtons"><button class="primaryBtn" onclick="UI.commitAttacks()">Commit attack${n>1?` (${n})`:''}</button></div></section>`;
    }
    const blocks=game.combat.attacks.filter(a=>a.blockerUid).length;
    const canResolve=game.phase==='Block'&&(humanAttacker||humanDefender);
    const blockHelp=humanDefender?'Drag a ready Critter onto an attacking Critter to block. Blue arrows show blocks.':`${blocks} block${blocks===1?'':'s'} assigned · blue arrows show blockers.`;
    return `<section class="combatRibbon activeCombat compactCombat"><div class="combatHeading"><span>⚔</span><div><b>${game.combat.attacks.length} attack${game.combat.attacks.length===1?'':'s'} · ${blocks} block${blocks===1?'':'s'}</b><small>${blockHelp}</small></div></div><div class="combatButtons">${canResolve?'<button class="primaryBtn" onclick="UI.resolveCombat()">Resolve combat</button>':''}</div>${game.phase==='Block'?reactionTray(humanIndex()):''}</section>`;
  }
'''
          s, n = re.subn(r'  function combatPanel\(\)\{.*?\n  \}\n\n  function reactionTray', combat+'\n  function reactionTray', s, count=1, flags=re.S)
          assert n == 1, 'combatPanel replacement failed'

          direct = r'''  const combatLinks=document.createElementNS('http://www.w3.org/2000/svg','svg');
  combatLinks.classList.add('combatLinkOverlay');
  combatLinks.setAttribute('aria-hidden','true');
  document.body.appendChild(combatLinks);

  function syncCombatArrows(){
    if(!game||game.winner||game.combat.resolved||!game.combat.attacks.length){combatLinks.replaceChildren();return;}
    combatLinks.innerHTML='<defs><marker id="combatAttackHead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path class="combatAttackHead" d="M0,0 L0,6 L9,3 z" /></marker><marker id="combatBlockHead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path class="combatBlockHead" d="M0,0 L0,6 L9,3 z" /></marker></defs>';
    const point=el=>{const r=el.getBoundingClientRect();return {x:r.left+r.width/2,y:r.top+r.height/2};};
    const curved=(from,to,cls,marker,bend)=>{
      const path=document.createElementNS('http://www.w3.org/2000/svg','path');
      const mx=(from.x+to.x)/2,my=(from.y+to.y)/2;
      const dx=to.x-from.x,dy=to.y-from.y,len=Math.max(1,Math.hypot(dx,dy));
      const cx=mx+(-dy/len)*bend,cy=my+(dx/len)*bend;
      path.setAttribute('d',`M ${from.x} ${from.y} Q ${cx} ${cy} ${to.x} ${to.y}`);
      path.setAttribute('class',cls);path.setAttribute('marker-end',`url(#${marker})`);combatLinks.appendChild(path);
    };
    game.combat.attacks.forEach((a,i)=>{
      const attacker=document.querySelector(`.gameCard.critter[data-resident-uid="${a.attackerUid}"]`);
      const target=a.target.kind==='hearthseed'
        ?document.querySelector(`[data-hearthseed-player="${1-game.active}"]`)
        :document.querySelector(`[data-building-uid="${a.target.uid}"]`);
      if(attacker&&target)curved(point(attacker),point(target),'combatAttackPath','combatAttackHead',i%2?18:-18);
      if(a.blockerUid){
        const blocker=document.querySelector(`.gameCard.critter[data-resident-uid="${a.blockerUid}"]`);
        if(blocker&&attacker)curved(point(blocker),point(attacker),'combatBlockPath','combatBlockHead',i%2?-26:26);
      }
    });
  }

  function installDirectManipulation(){
    const DRAG_THRESHOLD=7;
    let gesture=null,ghost=null,arrow=null,arrowLine=null;

    const clearTargets=()=>document.querySelectorAll('.directDropTarget,.directDropHover').forEach(el=>el.classList.remove('directDropTarget','directDropHover'));
    function cleanup(){
      clearTargets();ghost?.remove();arrow?.remove();ghost=null;arrow=null;arrowLine=null;
      document.body.classList.remove('directManipulating');gesture=null;
    }
    function cardGhost(source){const g=source.cloneNode(true);g.classList.add('dragCardGhost');g.removeAttribute('title');g.querySelectorAll('button,select').forEach(el=>el.remove());document.body.appendChild(g);return g;}
    function moveGhost(x,y){if(ghost){ghost.style.left=`${x}px`;ghost.style.top=`${y}px`;}}
    function linkArrow(source,kind){
      const r=source.getBoundingClientRect();
      const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.classList.add(kind==='block'?'dragBlockArrow':'dragAttackArrow');
      const marker=kind==='block'?'hnhBlockHead':'hnhAttackHead';
      svg.innerHTML=`<defs><marker id="${marker}" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" /></marker></defs><line marker-end="url(#${marker})" />`;
      document.body.appendChild(svg);const line=svg.querySelector('line');line.setAttribute('x1',String(r.left+r.width/2));line.setAttribute('y1',String(r.top+r.height/2));return {svg,line};
    }
    const under=(x,y)=>document.elementFromPoint(x,y);
    const recruitTarget=el=>el?.closest?.('[data-muster-uid]')||null;
    const attackTarget=el=>el?.closest?.('[data-attack-building],[data-hearthseed-player]')||null;
    const blockTarget=el=>el?.closest?.('.gameCard.critter[data-resident-uid]')||null;
    function attackKey(el){if(!el)return null;if(el.hasAttribute('data-attack-building'))return `building:${el.dataset.attackBuilding}`;if(el.hasAttribute('data-hearthseed-player'))return `hearthseed:${el.dataset.hearthseedPlayer}`;return null;}
    function markLegal(kind,legal){
      clearTargets();
      if(kind==='recruit')document.querySelectorAll('[data-muster-uid]').forEach(el=>{if(legal.has(String(el.dataset.musterUid)))el.classList.add('directDropTarget');});
      else if(kind==='attack'){
        document.querySelectorAll('[data-attack-building]').forEach(el=>{if(legal.has(`building:${el.dataset.attackBuilding}`))el.classList.add('directDropTarget');});
        document.querySelectorAll('[data-hearthseed-player]').forEach(el=>{if(legal.has(`hearthseed:${el.dataset.hearthseedPlayer}`))el.classList.add('directDropTarget');});
      }else document.querySelectorAll('.gameCard.critter[data-resident-uid]').forEach(el=>{if(legal.has(String(el.dataset.residentUid)))el.classList.add('directDropTarget');});
    }
    function begin(event){
      if(event.button!==0||event.target.closest('button,select,a'))return;
      const recruit=event.target.closest('.recruitDraggable'),block=event.target.closest('.blockDraggable'),attack=event.target.closest('.attackDraggable');
      if(!recruit&&!block&&!attack)return;
      if(recruit){
        const uid=+recruit.dataset.handUid,p=game.players[game.active],card=p.hand.find(c=>c.uid===uid);if(!card)return;
        const legalMusters=E.legalMusters(game,game.active,card);if(!legalMusters.length)return;
        gesture={kind:'recruit',uid,source:recruit,startX:event.clientX,startY:event.clientY,pointerId:event.pointerId,legal:new Set(legalMusters.map(m=>String(m.uid))),dragging:false};
      }else if(block){
        const defenderIndex=1-game.active,uid=+block.dataset.residentUid,p=game.players[defenderIndex],resident=p.residents.find(r=>r.uid===uid);if(!resident)return;
        const legalMap=new Map();game.combat.attacks.forEach((a,i)=>{if(E.canBlock(game,defenderIndex,resident,a))legalMap.set(String(a.attackerUid),i);});
        if(!legalMap.size)return;
        gesture={kind:'block',uid,defenderIndex,source:block,startX:event.clientX,startY:event.clientY,pointerId:event.pointerId,legal:new Set(legalMap.keys()),legalMap,dragging:false};
      }else{
        const uid=+attack.dataset.residentUid,p=game.players[game.active],resident=p.residents.find(r=>r.uid===uid);if(!resident||!E.canAttack(game,game.active,resident))return;
        const legalTargets=E.legalAttackTargets(game,game.active,resident);if(!legalTargets.length)return;
        const opponent=1-game.active;
        gesture={kind:'attack',uid,source:attack,startX:event.clientX,startY:event.clientY,pointerId:event.pointerId,legal:new Set(legalTargets.map(t=>t.kind==='hearthseed'?`hearthseed:${opponent}`:`building:${t.uid}`)),dragging:false};
      }
    }
    function start(){
      if(!gesture||gesture.dragging)return;gesture.dragging=true;document.body.classList.add('directManipulating');markLegal(gesture.kind,gesture.legal);
      if(gesture.kind==='recruit'){ghost=cardGhost(gesture.source);moveGhost(gesture.startX,gesture.startY);}
      else{const a=linkArrow(gesture.source,gesture.kind);arrow=a.svg;arrowLine=a.line;}
    }
    function move(event){
      if(!gesture||event.pointerId!==gesture.pointerId)return;
      if(!gesture.dragging&&Math.hypot(event.clientX-gesture.startX,event.clientY-gesture.startY)<DRAG_THRESHOLD)return;
      start();event.preventDefault();document.querySelectorAll('.directDropHover').forEach(el=>el.classList.remove('directDropHover'));
      const el=under(event.clientX,event.clientY);
      if(gesture.kind==='recruit'){
        moveGhost(event.clientX,event.clientY);const target=recruitTarget(el);if(target&&gesture.legal.has(String(target.dataset.musterUid)))target.classList.add('directDropHover');
      }else if(gesture.kind==='attack'){
        const target=attackTarget(el),valid=target&&gesture.legal.has(attackKey(target));arrowLine?.setAttribute('x2',String(event.clientX));arrowLine?.setAttribute('y2',String(event.clientY));arrow?.classList.toggle('valid',Boolean(valid));if(valid)target.classList.add('directDropHover');
      }else{
        const target=blockTarget(el),key=target?.dataset?.residentUid,valid=target&&gesture.legal.has(String(key));arrowLine?.setAttribute('x2',String(event.clientX));arrowLine?.setAttribute('y2',String(event.clientY));arrow?.classList.toggle('valid',Boolean(valid));if(valid)target.classList.add('directDropHover');
      }
    }
    function finish(event){
      if(!gesture||event.pointerId!==gesture.pointerId)return;const g=gesture;if(!g.dragging){cleanup();return;}
      event.preventDefault();const el=under(event.clientX,event.clientY);
      if(g.kind==='recruit'){
        const target=recruitTarget(el),musterUid=target?.dataset?.musterUid;if(target&&g.legal.has(String(musterUid))){cleanup();doAction(()=>E.recruit(game,game.active,g.uid,+musterUid));return;}
      }else if(g.kind==='attack'){
        const target=attackTarget(el),key=attackKey(target);if(target&&g.legal.has(key)){const targetArg=key.startsWith('hearthseed:')?'hearthseed':+target.dataset.attackBuilding;cleanup();doAction(()=>E.declareAttack(game,game.active,g.uid,targetArg));return;}
      }else{
        const target=blockTarget(el),key=String(target?.dataset?.residentUid||'');if(target&&g.legal.has(key)){const attackIndex=g.legalMap.get(key);cleanup();doAction(()=>E.assignBlock(game,g.defenderIndex,g.uid,attackIndex));return;}
      }
      cleanup();
    }
    document.addEventListener('pointerdown',begin,true);document.addEventListener('pointermove',move,{capture:true,passive:false});document.addEventListener('pointerup',finish,true);document.addEventListener('pointercancel',cleanup,true);window.addEventListener('blur',cleanup);
  }
'''
          s, n = re.subn(r'  function installDirectManipulation\(\)\{.*?\n  \}\n\n  function render\(\)\{', direct+'\n  function render(){', s, count=1, flags=re.S)
          assert n == 1, 'direct manipulation replacement failed'

          s = s.replace("Client v0.7.9 · Rules v0.6.2", "Client v0.8.0 · Rules v0.6.2")
          s = s.replace("version:'0.7.9'", "version:'0.8.0'")
          # Refresh persistent combat arrows after each board render.
          needle = "${handPanel()}${drawerPanel()}${harvestOverlay()}${winnerOverlay()}</div>`;\n  }"
          repl = "${handPanel()}${drawerPanel()}${harvestOverlay()}${winnerOverlay()}</div>`;\n    requestAnimationFrame(syncCombatArrows);\n  }"
          assert needle in s, 'render tail not found'
          s = s.replace(needle, repl, 1)
          # Keep arrows aligned when the viewport changes.
          s = s.replace("  installDirectManipulation();\n  render();", "  installDirectManipulation();\n  window.addEventListener('resize',()=>requestAnimationFrame(syncCombatArrows));\n  window.addEventListener('scroll',()=>requestAnimationFrame(syncCombatArrows),{passive:true});\n  render();", 1)
          client.write_text(s)

          css = Path('styles.css')
          c = css.read_text()
          c += r'''

/* ===== v0.8.0 combat links + Muster identity ===== */
.musterIdentity{margin:7px 0 5px;padding:7px 9px;border-radius:8px;border:1px solid rgba(62,72,49,.22);display:flex;align-items:baseline;justify-content:space-between;gap:8px;background:rgba(226,215,166,.55)}
.musterIdentity strong{font-family:Georgia,serif;font-size:18px;line-height:1;letter-spacing:.02em}
.musterIdentity small{font-size:9px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;opacity:.82;white-space:nowrap}
.muster-scurry{background:rgba(238,190,125,.56)}
.muster-lantern{background:rgba(246,218,116,.62);border-color:rgba(153,116,35,.4)}
.muster-bramble{background:rgba(167,198,134,.58)}
.muster-handwork{background:rgba(204,178,140,.58)}
.muster-gatewatch{background:rgba(154,186,194,.58)}
.muster-burrow{background:rgba(185,162,133,.62)}
.gameCard.building[data-muster-class] .buildingArt small{font-size:11px;font-weight:900;letter-spacing:.12em;color:#41553a}
.gameCard.building[data-muster-class] .cardFrame>p{margin-top:5px}

.combatLinkOverlay{position:fixed;inset:0;width:100vw;height:100vh;z-index:48;pointer-events:none;overflow:visible}
.combatAttackPath,.combatBlockPath{fill:none;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 2px rgba(0,0,0,.28))}
.combatAttackPath{stroke:#d9783c;stroke-width:5;opacity:.9}
.combatBlockPath{stroke:#58a9df;stroke-width:5;opacity:.95}
.combatAttackHead{fill:#d9783c}.combatBlockHead{fill:#58a9df}
.dragAttackArrow,.dragBlockArrow{position:fixed;inset:0;width:100vw;height:100vh;z-index:90;pointer-events:none;overflow:visible}
.dragAttackArrow line,.dragBlockArrow line{stroke-width:6;stroke-linecap:round;opacity:.78}
.dragAttackArrow line{stroke:#d9783c}.dragAttackArrow path{fill:#d9783c}
.dragBlockArrow line{stroke:#58a9df}.dragBlockArrow path{fill:#58a9df}
.dragAttackArrow.valid line,.dragBlockArrow.valid line{stroke-width:8;opacity:1}
.blockDraggable{cursor:crosshair;box-shadow:0 0 0 2px rgba(88,169,223,.26)}
.blockHint{background:rgba(88,169,223,.16)!important;color:#245d7e!important}
.directDropTarget.blocking,.blockDraggable.directDropTarget{outline-color:#58a9df}
.compactCombat .reactionTray{margin-top:7px}
'''
          css.write_text(c)

          idx = Path('index.html')
          x = idx.read_text().replace('v0.7.9','v0.8.0').replace('v=079','v=080')
          idx.write_text(x)

          readme = Path('README.md')
          if readme.exists():
            readme.write_text(readme.read_text().replace('v0.7.9','v0.8.0'))

          test = Path('tests/ui-coordinator-test.js')
          t = test.read_text()
          insert = r'''

ok('v0.8.0 uses persistent attack/block arrows and direct blocking',()=>{
  const source=fs.readFileSync('client.js','utf8');
  assert(/combatLinkOverlay/.test(source),'persistent combat arrow overlay missing');
  assert(/combatBlockPath/.test(source),'blue block arrow path missing');
  assert(/blockDraggable/.test(source),'direct block dragging missing');
  assert(/E\.assignBlock\(game,g\.defenderIndex,g\.uid,attackIndex\)/.test(source),'drop-to-block resolution missing');
  assert(!/id=\\"blk-\$\{i\}\\"/.test(source),'legacy blocker dropdown should be removed');
});

ok('v0.8.0 gives Muster Class a single prominent identity band',()=>{
  const source=fs.readFileSync('client.js','utf8');
  assert(/musterIdentity/.test(source),'Muster identity band missing');
  assert(/musterRulesText/.test(source),'duplicate Muster rules text cleanup missing');
  assert(/data-muster-class/.test(source),'Muster class styling hook missing');
});
'''
          marker = "console.log('\\nAll consolidated UI/runtime tests passed.');"
          assert marker in t, 'UI test marker missing'
          t = t.replace(marker, insert+'\n'+marker)
          test.write_text(t)
          PY
          node tests/smoke-test.js
          node tests/rules-test.js
          node tests/rules-patch-test.js
          node tests/ability-completion-test.js
          node tests/ability-edge-test.js
          node tests/ui-coordinator-test.js
          node --check data.js
          node --check engine.js
          node --check client.js
      - name: Commit refactor and remove one-time workflow
        run: |
          rm .github/workflows/one-time-v080.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add client.js styles.css index.html README.md tests/ui-coordinator-test.js .github/workflows/one-time-v080.yml
          git commit -m "Add persistent combat arrows and clearer Muster cards"
          git push origin HEAD:feat/combat-arrows-muster-clarity-v080
