name: v080-refactor
on:
  push:
    branches:
      - feat/combat-arrows-muster-clarity-v080
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/combat-arrows-muster-clarity-v080
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare and run refactor
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/v080_refactor.py')
          s=p.read_text()
          s=s.replace("building+'\\n  function workshopAction',s,count=1,flags=re.S)","lambda _m: building+'\\n  function workshopAction',s,count=1,flags=re.S)")
          s=s.replace("critter+'\\n  function handPanel',s,count=1,flags=re.S)","lambda _m: critter+'\\n  function handPanel',s,count=1,flags=re.S)")
          s=s.replace("combat+'\\n  function reactionTray',s,count=1,flags=re.S)","lambda _m: combat+'\\n  function reactionTray',s,count=1,flags=re.S)")
          cut=s.index("\ntest=Path('tests/ui-coordinator-test.js')")
          p.write_text(s[:cut])
          PY
          python tools/v080_refactor.py
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('client.js')
          s=p.read_text()
          s=re.sub(r"window\.HNH_UI_COORDINATOR=\{flush:queueFlush,version:'[^']+'\};", "window.HNH_UI_COORDINATOR={flush:queueFlush,version:'0.8.0'};", s)
          p.write_text(s)
          PY
          sed -i 's/v=079/v=080/g; s/v0\.7\.9/v0.8.0/g; /coordinator version missing/d' tests/*.js
          python -c "from pathlib import Path; p=Path('tests/ui-coordinator-test.js'); s=p.read_text(); s += \"\\nassert(client.includes('combatLinkOverlay'),'persistent combat arrow overlay missing');\\nassert(client.includes('combatBlockPath'),'blue block arrow path missing');\\nassert(client.includes('blockDraggable'),'direct block dragging missing');\\nassert(client.includes('musterIdentity')&&client.includes('musterRulesText'),'Muster identity cleanup missing');\\nassert(client.includes(\\\"version:'0.8.0'\\\"),'v0.8.0 coordinator version missing');\\nconsole.log('✓ persistent attack/block arrows and clearer Muster identity');\\n\"; p.write_text(s)"
      - run: |
          node tests/smoke-test.js
          node tests/rules-test.js
          node tests/rules-patch-test.js
          node tests/ability-completion-test.js
          node tests/ability-edge-test.js
          node tests/ui-coordinator-test.js
          node --check data.js
          node --check engine.js
          node --check client.js
      - run: |
          rm tools/v080_refactor.py .github/workflows/one-time-v080.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+jetpropulsioncloud@users.noreply.github.com
          git add -A
          git commit -m "Add persistent combat arrows and clearer Muster cards"
          git push origin HEAD:feat/combat-arrows-muster-clarity-v080
