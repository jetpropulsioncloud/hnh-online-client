name: Hearth & Hollow smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deck/data smoke test
        run: node smoke-test.js
      - name: Run v0.6.2 rule regression tests
        run: node rules-test.js
      - name: Run attack sequencing regression tests
        run: node rules-patch-test.js
      - name: Run v0.6.2 card ability completion gate
        run: node ability-completion-test.js
      - name: Run card ability timing and empty-zone gate
        run: node ability-edge-test.js
      - name: Run UI observer churn gate
        run: node ui-coordinator-test.js
      - name: Check tabletop interaction scripts
        run: |
          node --check tabletop-interactions.js
          node --check tabletop-deck-polish.js
          node --check social-links.js
          node --check ability-completion.js
          node --check ability-completion-fixes.js
          node --check ability-ui.js
          node --check data-v062-completion.js
          node --check ui-coordinator.js
