name: One-time runtime consolidation

on:
  push:
    branches:
      - refactor/consolidate-runtime

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: refactor/consolidate-runtime
          fetch-depth: 0
      - name: Consolidate runtime
        run: bash scripts/consolidate.sh
