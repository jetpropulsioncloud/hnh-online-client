name: One-time runtime consolidation

on:
  push:
    branches: ['refactor/consolidate-runtime']

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: refactor/consolidate-runtime
          fetch-depth: 0

      - name: Collapse runtime layers
        shell: bash
        run: |
          set -euo pipefail

          {
            cat data.js
            printf '\n\n/* ===== v0.6.2 completed card data ===== */\n'
            cat data-v062-completion.js
          } > data.merged.js
          mv data.merged.js data.js

          {
            cat engine-v062.js
            printf '\n\n/* ===== v0.6.2 sequencing/rules patches ===== */\n'
            cat engine-rules-patches.js
            printf '\n\n/* ===== v0.6.2 card ability completion ===== */\n'
            cat ability-completion.js
            printf '\n\n/* ===== v0.6.2 card ability edge fixes ===== */\n'
            cat ability-completion-fixes.js
          } > engine.js

          {
            cat client-v062.js
            printf '\n\n/* ===== coordinated render notifications ===== */\n'
            cat ui-coordinator.js
            printf '\n\n/* ===== tabletop interaction layer ===== */\n'
            cat tabletop-interactions.js
            printf '\n\n/* ===== tabletop deck polish ===== */\n'
            cat tabletop-deck-polish.js
            printf '\n\n/* ===== community links ===== */\n'
            cat social-links.js
            printf '\n\n/* ===== ability choice UI ===== */\n'
            cat ability-ui.js
          } > client.js

          sed -E -i "s/Client v0\.[0-9]+\.[0-9]+ · Rules v0\.6\.2/Client v0.7.4 · Rules v0.6.2/g" client.js
          sed -i "s/version:'0.7.3'/version:'0.7.4'/g" client.js

          {
            cat client-v062.css
            printf '\n\n/* ===== card inspection + tabletop decks ===== */\n'
            cat tabletop-interactions.css
            printf '\n\n/* ===== draggable deck polish ===== */\n'
            cat tabletop-deck-polish.css
            printf '\n\n/* ===== community links ===== */\n'
            cat social-links.css
            printf '\n\n/* ===== ability choice UI ===== */\n'
            cat ability-ui.css
            printf '\n\n/* ===== deck visual stability ===== */\n'
            cat deck-stability.css
          } > styles.css

          cat > index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Hearth & Hollow — Tabletop Client v0.7.4</title>
            <link rel="stylesheet" href="styles.css?v=074" />
          </head>
          <body>
            <div id="app"></div>
            <script src="data.js?v=074"></script>
            <script src="engine.js?v=074"></script>
            <script src="client.js?v=074"></script>
          </body>
          </html>
          EOF

          mkdir -p tests
          git mv smoke-test.js tests/smoke-test.js
          git mv rules-test.js tests/rules-test.js
          git mv rules-patch-test.js tests/rules-patch-test.js
          git mv ability-completion-test.js tests/ability-completion-test.js
          git mv ability-edge-test.js tests/ability-edge-test.js
          git mv ui-coordinator-test.js tests/ui-coordinator-test.js

          python3 - <<'PY'
          from pathlib import Path

          p=Path('tests/smoke-test.js')
          s=p.read_text()
          s=s.replace("require('./data.js');", "require('../data.js');")
          marker='// Static runtime wiring smoke.'
          s=s[:s.index(marker)] + '''// Static runtime wiring smoke. The browser should load only the four consolidated runtime assets.\nconst html = fs.readFileSync('index.html', 'utf8');\nassert(html.includes('styles.css?v=074'), 'consolidated styles.css is not loaded');\nassert(html.includes('data.js?v=074'), 'consolidated data.js is not loaded');\nassert(html.includes('engine.js?v=074'), 'consolidated engine.js is not loaded');\nassert(html.includes('client.js?v=074'), 'consolidated client.js is not loaded');\nassert(!html.includes('client-v062.js') && !html.includes('engine-v062.js'), 'legacy split runtime is still referenced');\nassert(html.includes('Tabletop Client v0.7.4'), 'client presentation version mismatch');\nconsole.log('✓ consolidated client/runtime wiring smoke');\n'''
          p.write_text(s)

          p=Path('tests/rules-test.js')
          s=p.read_text().replace("fs.readFileSync('engine-v062.js','utf8'),{filename:'engine-v062.js'}", "fs.readFileSync('engine.js','utf8'),{filename:'engine.js'}")
          start=s.index("ok('Client script parses and exposes UI'")
          end=s.index('\n});',start)+4
          replacement="""ok('Consolidated client parses and contains the UI export',()=>{\n  const source=fs.readFileSync('client.js','utf8');\n  new vm.Script(source,{filename:'client.js'});\n  assert(/window\\.UI\\s*=/.test(source),'client UI export missing');\n});"""
          s=s[:start]+replacement+s[end:]
          p.write_text(s)

          p=Path('tests/rules-patch-test.js')
          s=p.read_text().replace("['data.js','engine-v062.js','engine-rules-patches.js']", "['data.js','engine.js']")
          p.write_text(s)

          for name in ['ability-completion-test.js','ability-edge-test.js']:
            p=Path('tests')/name
            s=p.read_text().replace("['data.js','data-v062-completion.js','engine-v062.js','engine-rules-patches.js','ability-completion.js','ability-completion-fixes.js']", "['data.js','engine.js']")
            p.write_text(s)

          Path('tests/ui-coordinator-test.js').write_text(r'''const fs=require('fs');
const assert=require('assert');

const html=fs.readFileSync('index.html','utf8');
const client=fs.readFileSync('client.js','utf8');

assert(html.includes('styles.css?v=074'),'styles.css must be the single stylesheet');
assert(html.includes('data.js?v=074')&&html.includes('engine.js?v=074')&&html.includes('client.js?v=074'),'consolidated runtime files are not wired');
assert((html.match(/<script src=/g)||[]).length===3,'index.html should load exactly three runtime scripts');
assert((html.match(/rel="stylesheet"/g)||[]).length===1,'index.html should load exactly one stylesheet');
assert(client.includes('CoordinatedMutationObserver'),'coordinated observer shim missing from consolidated client');
assert(client.includes('appObservers'),'single app observer registry missing');
assert(client.includes("version:'0.7.4'"),'coordinator version missing');
assert(html.includes('Tabletop Client v0.7.4'),'presentation version not bumped');

const retired=[
  'client-v062.js','ui-coordinator.js','tabletop-interactions.js','tabletop-deck-polish.js','social-links.js','ability-ui.js',
  'client-v062.css','tabletop-interactions.css','tabletop-deck-polish.css','social-links.css','ability-ui.css','deck-stability.css',
  'engine-v062.js','engine-rules-patches.js','ability-completion.js','ability-completion-fixes.js','data-v062-completion.js',
  'fixed-tabletop.js','fixed-tabletop.css','app.js','_stop'
];
for(const file of retired)assert(!fs.existsSync(file),`${file} should be retired after consolidation`);

console.log('✓ runtime is consolidated to data.js + engine.js + client.js + styles.css');
console.log('✓ UI observer coordination survived consolidation');
''')
          PY

          cat > .github/workflows/smoke.yml <<'EOF'
          name: Hearth & Hollow smoke

          on:
            push:
              branches: [main]
            pull_request:
              branches: [main]

          permissions:
            contents: read

          jobs:
            smoke:
              runs-on: ubuntu-latest
              steps:
                - name: Check out repository
                  uses: actions/checkout@v4
                - name: Set up Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: '22'
                - name: Run deck/data smoke test
                  run: node tests/smoke-test.js
                - name: Run v0.6.2 rule regression tests
                  run: node tests/rules-test.js
                - name: Run attack sequencing regression tests
                  run: node tests/rules-patch-test.js
                - name: Run v0.6.2 card ability completion gate
                  run: node tests/ability-completion-test.js
                - name: Run card ability timing and empty-zone gate
                  run: node tests/ability-edge-test.js
                - name: Run consolidated UI/runtime gate
                  run: node tests/ui-coordinator-test.js
                - name: Check consolidated runtime syntax
                  run: |
                    node --check data.js
                    node --check engine.js
                    node --check client.js
          EOF

          cat > README.md <<'EOF'
          # Hearth & Hollow — Online Client

          A zero-install browser playtest client for **Hearth & Hollow rules v0.6.2**.

          ## Run it

          Open `index.html` in a modern desktop browser and choose a starter village. No server or build step is required.

          ## Runtime architecture

          The browser now loads only four project assets:

          - `data.js` — complete v0.6.2 starter card/deck data.
          - `engine.js` — rules engine, combat sequencing, and completed starter-card abilities.
          - `client.js` — rendering, tabletop interactions, card inspection, deck movement, social links, ability-choice UI, and coordinated render notifications.
          - `styles.css` — the complete tabletop presentation layer.

          `index.html` is only the entry point. Regression tests live under `tests/` and are **not loaded by the browser**.

          ## Current rules checkpoint

          - 45-card Field Decks and 12-card known Blueprint Decks.
          - Founding Building starts separately; Village size is unlimited.
          - Six Muster Classes: Scurry, Lantern, Bramble, Handwork, Gatewatch, Burrow.
          - Every Critter occupies 1 Housing; Advanced Critters require an upgraded matching Muster.
          - Provision is its own resource; a Provision cost may instead be paid 1-for-1 with Acorn, Sap, Root, or Pebble.
          - Persistent Building damage, Ruined/rehousing rules, Shield, First Yield, Guard, Tool Access, Reaction Access, Peaceful limits, Exposed, and Dawn Prosperity victory follow v0.6.2.
          - Starter card abilities, including Field Deck / Compost choice effects, are covered by regression tests.

          ## Tests

          With Node.js installed:

          ```bash
          node tests/smoke-test.js
          node tests/rules-test.js
          node tests/rules-patch-test.js
          node tests/ability-completion-test.js
          node tests/ability-edge-test.js
          node tests/ui-coordinator-test.js
          ```

          GitHub Actions runs the same gates on pull requests and pushes to `main`.
          EOF

          rm -f \
            data-v062-completion.js \
            engine-v062.js engine-rules-patches.js ability-completion.js ability-completion-fixes.js \
            client-v062.js ui-coordinator.js tabletop-interactions.js tabletop-deck-polish.js social-links.js ability-ui.js \
            client-v062.css tabletop-interactions.css tabletop-deck-polish.css social-links.css ability-ui.css deck-stability.css

          rm -f .github/workflows/consolidate-once.yml

      - name: Verify consolidated repo
        shell: bash
        run: |
          set -euo pipefail
          node --check data.js
          node --check engine.js
          node --check client.js
          node tests/smoke-test.js
          node tests/rules-test.js
          node tests/rules-patch-test.js
          node tests/ability-completion-test.js
          node tests/ability-edge-test.js
          node tests/ui-coordinator-test.js

      - name: Commit consolidation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Consolidate browser runtime and move tests' || exit 0
          git push origin HEAD:refactor/consolidate-runtime
