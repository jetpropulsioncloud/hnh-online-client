name: compact-muster-pass
on:
  push:
    branches:
      - fix/compact-muster-identity
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/compact-muster-identity
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compact Muster identity bands
        run: |
          cat >> styles.css <<'CSS'

/* ===== compact Muster identity tuning ===== */
.musterIdentity{margin:5px 0 4px;padding:4px 6px;gap:5px;border-radius:7px;min-height:0}
.musterIdentity strong{font-size:13px;line-height:1.05;letter-spacing:.015em;flex:0 1 auto}
.musterIdentity small{font-size:7.5px;line-height:1.1;letter-spacing:.035em;white-space:nowrap;flex:0 0 auto}
.gameCard.building[data-muster-class] .buildingArt small{font-size:8.5px;letter-spacing:.09em}
CSS
      - name: Run regression suite
        run: |
          node tests/smoke-test.js
          node tests/rules-test.js
          node tests/rules-patch-test.js
          node tests/ability-completion-test.js
          node tests/ability-edge-test.js
          node tests/ui-coordinator-test.js
          node --check data.js
          node --check engine.js
          node --check client.js
      - name: Commit compact styling
        run: |
          rm .github/workflows/one-time-compact-muster.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Compact Muster class identity bands"
          git push origin HEAD:fix/compact-muster-identity
