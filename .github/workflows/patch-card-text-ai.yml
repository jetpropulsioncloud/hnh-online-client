name: One-time card text and AI onboarding patch

on:
  push:
    branches:
      - fix/card-text-ai-onboarding

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/card-text-ai-onboarding
          fetch-depth: 0
      - name: Apply patch and test
        run: |
          python3 scripts/patch-card-text-ai.py
          python3 scripts/fix-test-version.py
          node --check data.js
          node --check engine.js
          node --check client.js
          node tests/smoke-test.js
          node tests/rules-test.js
          node tests/rules-patch-test.js
          node tests/ability-completion-test.js
          node tests/ability-edge-test.js
          node tests/ui-coordinator-test.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/patch-card-text-ai.py scripts/fix-test-version.py
          git add -A
          git commit -m 'Sync card text and improve solo onboarding AI'
          git push origin HEAD:fix/card-text-ai-onboarding
