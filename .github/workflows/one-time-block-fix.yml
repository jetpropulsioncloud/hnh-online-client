name: human-block-drag-fix
on:
  push:
    branches:
      - fix/human-block-drag-v081
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/human-block-drag-v081
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair direct blocking interaction
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('client.js')
          s=p.read_text()

          old="""    const directAttrs=canDragBlock?` data-block-indices=\"${legalBlockIndices.join(',')}\" title=\"Drag this Critter onto an attacker to block\"`:canDragAttack?' title=\"Drag this Critter to an enemy target\"':'';
    return `<article class=\"gameCard critter ${!ready?'inactive':''} ${r.tired?'tired':''} ${r.attacking?'attacking':''} ${r.blocking?'blocking':''}${directClass}\" data-resident-uid=\"${r.uid}\" data-player-index=\"${pi}\"${directAttrs}>"""
          new="""    const directAttrs=canDragBlock?` data-block-indices=\"${legalBlockIndices.join(',')}\" title=\"Drag this Critter onto an attacker to block\"`:canDragAttack?' title=\"Drag this Critter to an enemy target\"':'';
    const incomingAttackIndex=game.phase==='Block'?game.combat.attacks.findIndex(a=>a.attackerUid===r.uid):-1;
    const incomingAttackAttr=incomingAttackIndex>=0?` data-block-attack-index=\"${incomingAttackIndex}\"`:'';
    return `<article class=\"gameCard critter ${!ready?'inactive':''} ${r.tired?'tired':''} ${r.attacking?'attacking':''} ${r.blocking?'blocking':''}${directClass}\" data-resident-uid=\"${r.uid}\" data-player-index=\"${pi}\"${directAttrs}${incomingAttackAttr}>"""
          assert old in s, 'critter card hook not found'
          s=s.replace(old,new,1)

          old="blockTarget=el=>el?.closest?.('.gameCard.critter[data-resident-uid]')||null;"
          new="blockTarget=el=>el?.closest?.('.gameCard.critter[data-block-attack-index]')||null;"
          assert old in s, 'block target selector not found'
          s=s.replace(old,new,1)

          old="else document.querySelectorAll('.gameCard.critter[data-resident-uid]').forEach(el=>{if(legal.has(String(el.dataset.residentUid)))el.classList.add('directDropTarget');});"
          new="else document.querySelectorAll('.gameCard.critter[data-block-attack-index]').forEach(el=>{if(legal.has(String(el.dataset.blockAttackIndex)))el.classList.add('directDropTarget');});"
          assert old in s, 'block legal target marker not found'
          s=s.replace(old,new,1)

          old="const legalMap=new Map();game.combat.attacks.forEach((a,i)=>{if(E.canBlock(game,defenderIndex,resident,a))legalMap.set(String(a.attackerUid),i);});if(!legalMap.size)return;gesture={kind:'block',uid,defenderIndex,source:block,startX:event.clientX,startY:event.clientY,pointerId:event.pointerId,legal:new Set(legalMap.keys()),legalMap,dragging:false};"
          new="const legalMap=new Map();game.combat.attacks.forEach((a,i)=>{if(E.canBlock(game,defenderIndex,resident,a))legalMap.set(String(i),i);});if(!legalMap.size)return;gesture={kind:'block',uid,defenderIndex,source:block,startX:event.clientX,startY:event.clientY,pointerId:event.pointerId,legal:new Set(legalMap.keys()),legalMap,dragging:false};"
          assert old in s, 'block gesture map not found'
          s=s.replace(old,new,1)

          old="const target=blockTarget(el),key=target?.dataset?.residentUid,valid=target&&gesture.legal.has(String(key));"
          new="const target=blockTarget(el),key=target?.dataset?.blockAttackIndex,valid=target&&gesture.legal.has(String(key));"
          assert old in s, 'block move target lookup not found'
          s=s.replace(old,new,1)

          old="const target=blockTarget(el),key=String(target?.dataset?.residentUid||'');if(target&&g.legal.has(key)){const attackIndex=g.legalMap.get(key);cleanup();doAction(()=>E.assignBlock(game,g.defenderIndex,g.uid,attackIndex));return;}"
          new="const target=blockTarget(el),key=String(target?.dataset?.blockAttackIndex??'');if(target&&g.legal.has(key)){const attackIndex=g.legalMap.get(key);cleanup();doAction(()=>E.assignBlock(game,g.defenderIndex,g.uid,attackIndex));return;}"
          assert old in s, 'block finish target lookup not found'
          s=s.replace(old,new,1)

          # Keep pointer ownership stable through long cross-board drags.
          old="gesture={kind:'attack',uid,source:attack,startX:event.clientX,startY:event.clientY,pointerId:event.pointerId,legal:new Set(legalTargets.map(t=>t.kind==='hearthseed'?`hearthseed:${opponent}`:`building:${t.uid}`)),dragging:false};}}"
          new="gesture={kind:'attack',uid,source:attack,startX:event.clientX,startY:event.clientY,pointerId:event.pointerId,legal:new Set(legalTargets.map(t=>t.kind==='hearthseed'?`hearthseed:${opponent}`:`building:${t.uid}`)),dragging:false};}gesture?.source?.setPointerCapture?.(event.pointerId);}" 
          assert old in s, 'pointer capture insertion point not found'
          s=s.replace(old,new,1)

          s=s.replace("Client v0.8.0 · Rules v0.6.2","Client v0.8.1 · Rules v0.6.2")
          s=s.replace("version:'0.8.0'","version:'0.8.1'")
          p.write_text(s)

          css=Path('styles.css')
          c=css.read_text()
          c += "\n/* ===== v0.8.1 blocking reliability ===== */\n.blockDraggable{touch-action:none;user-select:none;cursor:grab}.blockDraggable:active{cursor:grabbing}\n.gameCard.critter[data-block-attack-index].directDropTarget{outline-color:#58a9df!important;box-shadow:0 0 0 5px rgba(88,169,223,.14),0 0 26px rgba(88,169,223,.34)!important}\n"
          css.write_text(c)

          idx=Path('index.html')
          i=idx.read_text().replace('v0.8.0','v0.8.1').replace('v=080','v=081')
          idx.write_text(i)

          for tp in Path('tests').glob('*.js'):
            t=tp.read_text().replace('v0.8.0','v0.8.1').replace('v=080','v=081')
            tp.write_text(t)
          tp=Path('tests/ui-coordinator-test.js')
          t=tp.read_text()+"\nassert(client.includes('data-block-attack-index'),'explicit block attack index missing');\nassert(client.includes('setPointerCapture'),'pointer capture missing for direct manipulation');\nassert(css.includes('.blockDraggable{touch-action:none'),'block drag touch-action guard missing');\nconsole.log('✓ human blocking uses explicit attack targets and stable pointer capture');\n"
          tp.write_text(t)
          PY
      - name: Run regression suite
        run: |
          node tests/smoke-test.js
          node tests/rules-test.js
          node tests/rules-patch-test.js
          node tests/ability-completion-test.js
          node tests/ability-edge-test.js
          node tests/ui-coordinator-test.js
          node --check data.js
          node --check engine.js
          node --check client.js
      - name: Commit blocking fix
        run: |
          rm .github/workflows/one-time-block-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix human drag-to-block interaction"
          git push origin HEAD:fix/human-block-drag-v081
