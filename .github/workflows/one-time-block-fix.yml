name: human-block-drag-fix
on:
  push:
    branches:
      - fix/human-block-drag-v081
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/human-block-drag-v081
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tools/blockfix.py
      - run: |
          node tests/smoke-test.js
          node tests/rules-test.js
          node tests/rules-patch-test.js
          node tests/ability-completion-test.js
          node tests/ability-edge-test.js
          node tests/ui-coordinator-test.js
          node --check data.js
          node --check engine.js
          node --check client.js
      - run: |
          rm tools/blockfix.py .github/workflows/one-time-block-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix human drag-to-block interaction"
          git push origin HEAD:fix/human-block-drag-v081
