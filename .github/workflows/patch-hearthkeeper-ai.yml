name: One-time Hearthkeeper and AI skill patch

on:
  push:
    branches:
      - feat/hearthkeeper-ai-skill

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/hearthkeeper-ai-skill
          fetch-depth: 0
      - name: Apply patch and test
        run: |
          python3 scripts/patch-hearthkeeper-ai.py
          python3 scripts/fix-ui-test.py
          node --check data.js
          node --check engine.js
          node --check client.js
          node tests/smoke-test.js
          node tests/rules-test.js
          node tests/rules-patch-test.js
          node tests/ability-completion-test.js
          node tests/ability-edge-test.js
          node tests/ui-coordinator-test.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/patch-hearthkeeper-ai.py scripts/fix-ui-test.py .github/workflows/patch-hearthkeeper-ai.yml
          git add -A
          git commit -m 'Add Hearthkeeper identity and AI skill profiles'
          git push origin HEAD:feat/hearthkeeper-ai-skill
