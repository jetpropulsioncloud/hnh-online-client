name: hand-fan-patch
on:
  push:
    branches: [feature/hearthstone-hand-fan]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hearthstone-hand-fan
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch hand fan
        run: python tools/handfan.py
      - name: Run regression suite
        run: |
          node tests/smoke-test.js
          node tests/rules-test.js
          node tests/rules-patch-test.js
          node tests/ability-completion-test.js
          node tests/ability-edge-test.js
          node tests/ui-coordinator-test.js
          node --check data.js
          node --check engine.js
          node --check client.js
      - name: Commit hand fan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client.js styles.css tests/ui-coordinator-test.js
          git diff --cached --quiet && exit 0
          git commit -m "Add Hearthstone-inspired hand fan"
          git push origin HEAD:feature/hearthstone-hand-fan
