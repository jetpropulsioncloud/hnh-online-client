name: hand-fan-viewport-fix
on:
  push:
    branches: [fix/hand-fan-viewport]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hand-fan-viewport
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch hand fan viewport
        run: python tools/handfanfix.py
      - name: Run regression suite
        run: |
          node tests/smoke-test.js
          node tests/rules-test.js
          node tests/rules-patch-test.js
          node tests/ability-completion-test.js
          node tests/ability-edge-test.js
          node tests/ui-coordinator-test.js
          node --check data.js
          node --check engine.js
          node --check client.js
      - name: Commit viewport fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css tests/ui-coordinator-test.js
          git diff --cached --quiet && exit 0
          git commit -m "Keep hand fan fully inside viewport"
          git push origin HEAD:fix/hand-fan-viewport
