name: One-time v0.7.9 direct manipulation patch
on:
  push:
    branches: [feat/direct-manipulation-v079]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/direct-manipulation-v079
          fetch-depth: 0
      - name: Apply patch and test
        run: |
          python3 scripts/patch-direct-manipulation-v079.py
          node --check data.js
          node --check engine.js
          node --check client.js
          node tests/smoke-test.js
          node tests/rules-test.js
          node tests/rules-patch-test.js
          node tests/ability-completion-test.js
          node tests/ability-edge-test.js
          node tests/ui-coordinator-test.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client.js styles.css index.html tests/smoke-test.js tests/ui-coordinator-test.js
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
          else
            git commit -m "Add physical recruit and drag-arrow combat interactions"
            git push origin HEAD:feat/direct-manipulation-v079
          fi
