name: One-time UI declutter and fidgets patch

on:
  push:
    branches:
      - feat/ui-declutter-fidgets

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/ui-declutter-fidgets
          fetch-depth: 0
      - name: Apply patch and test
        run: |
          python3 scripts/patch-ui-declutter-fidgets.py
          node --check data.js
          node --check engine.js
          node --check client.js
          node tests/smoke-test.js
          node tests/rules-test.js
          node tests/rules-patch-test.js
          node tests/ability-completion-test.js
          node tests/ability-edge-test.js
          node tests/ui-coordinator-test.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/patch-ui-declutter-fidgets.py .github/workflows/patch-ui-declutter-fidgets.yml
          git add -A
          git commit -m 'Declutter setup and scatter ambient table fidgets'
          git push origin HEAD:feat/ui-declutter-fidgets
