name: hand-resource-hud-fix
on:
  push:
    branches: [fix/fixed-hand-resources-v082]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fixed-hand-resources-v082
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch hand HUD
        run: python tools/handhudfix.py
      - name: Run regression suite
        run: |
          node tests/smoke-test.js
          node tests/rules-test.js
          node tests/rules-patch-test.js
          node tests/ability-completion-test.js
          node tests/ability-edge-test.js
          node tests/ui-coordinator-test.js
          node --check data.js
          node --check engine.js
          node --check client.js
      - name: Commit hand HUD
        run: |
          rm tools/handhudfix.py .github/workflows/one-time-hand-hud-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Keep resources visible with hand HUD"
          git push
