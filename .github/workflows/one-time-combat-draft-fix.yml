name: combat-draft-fix
on:
  push:
    branches:
      - fix/combat-draft-v081
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/combat-draft-v081
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Simplify attack drafting
        run: python tools/combatdraftfix.py
      - name: Run regression suite
        run: |
          node tests/smoke-test.js
          node tests/rules-test.js
          node tests/rules-patch-test.js
          node tests/ability-completion-test.js
          node tests/ability-edge-test.js
          node tests/ui-coordinator-test.js
          node --check data.js
          node --check engine.js
          node --check client.js
      - name: Commit combat draft simplification
        run: |
          rm tools/combatdraftfix.py .github/workflows/one-time-combat-draft-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Simplify attack declaration flow"
          git push origin HEAD:fix/combat-draft-v081
