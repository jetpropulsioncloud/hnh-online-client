name: one-screen-tabletop-fix
on:
  push:
    branches: [feature/no-scroll-tabletop-v1]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/no-scroll-tabletop-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch one-screen tabletop
        run: |
          python tools/viewportfix.py
          sed -i 's/v0\.8\.1/v0.8.0/g; s/v=081/v=080/g; s/version:\x270\.8\.1\x27/version:\x270.8.0\x27/g' client.js index.html tests/*.js
      - name: Run regression suite
        run: |
          node tests/smoke-test.js
          node tests/rules-test.js
          node tests/rules-patch-test.js
          node tests/ability-completion-test.js
          node tests/ability-edge-test.js
          node tests/ui-coordinator-test.js
          node --check data.js
          node --check engine.js
          node --check client.js
      - name: Commit one-screen tabletop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client.js styles.css index.html tests
          git diff --cached --quiet && exit 0
          git commit -m "Make match tabletop fit one screen"
          git push origin HEAD:feature/no-scroll-tabletop-v1
